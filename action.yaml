name: Cache Next Build

description: Builds the Next.js app and caches the result

branding:
  color: yellow
  icon: cpu
runs:
  using: "composite"
  steps:
    - name: Cache build
      id: build-cache
      uses: actions/cache@v4
      with:
        path: |
          ${{ github.workspace }}/.next
        key: build-${{ github.sha }}
        restore-keys: |
          build-

    - name: Build app
      if: steps.build-cache.outputs.cache-hit != 'true'
      shell: sh
      run: yarn build
